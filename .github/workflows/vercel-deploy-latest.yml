# Primary production deploy path — Vercel Git deploy on main is disabled in Svivva/vercel.json
# so spend-cap "Account is blocked" Git checks do not block shipping; this job resumes + deploys.
#
# Setup (pick one):
#   Easy — GitHub secret VERCEL_DEPLOY_HOOK
#     Vercel → all-de-apps-in-one → Settings → Git → Deploy Hooks → main branch
#   Full — VERCEL_TOKEN + VERCEL_ORG_ID + VERCEL_PROJECT_ID (clears queue first)
#
# Run manually: Actions → "Deploy latest (Vercel production)" → Run workflow
#
name: Deploy latest (Vercel production)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Svivva/**"
      - ".github/workflows/vercel-deploy-latest.yml"
      - ".github/workflows/vercel-production-auto.yml"

concurrency:
  group: vercel-production-main
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Svivva/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@53.3.1

      - name: Clear queue and deploy latest
        working-directory: Svivva
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_GuJh1mdYQPgRIhJaagdpM8lw' }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_dFOy1SeDx3JLYTxfsnZ7Fd68bIQr' }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          VERCEL_CI_DEPLOY: "true"
        run: node scripts/ci-vercel-deploy.mjs

      - name: Confirm production is live
        if: success()
        working-directory: Svivva
        run: node scripts/verify-production-live.mjs

      - name: Report deploy status (when Vercel Git is paused)
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "success",
              context: "Production deploy (Vercel Actions)",
              description: "zzaizzai.com live — resume + CLI deploy",
              target_url: "https://zzaizzai.com",
            });
