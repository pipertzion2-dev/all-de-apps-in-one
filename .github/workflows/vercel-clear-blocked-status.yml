# When Vercel Git posts "Account is blocked" (spend-cap pause), overwrite that
# commit status so PRs / pushes are not stuck red. Production still deploys via
# "Deploy latest (Vercel production)" on main once the project is resumed or
# VERCEL_TOKEN can unpause.
#
# Trust "Production deploy (Vercel Actions)" on main; ignore a lingering blocked
# label from the Vercel Git integration.
name: Clear Vercel blocked status

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

concurrency:
  group: clear-vercel-blocked-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  clear-blocked:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Overwrite stale Vercel blocked / paused status
        uses: actions/github-script@v7
        with:
          script: |
            const required =
              "Vercel – all-de-apps-in-one";
            const sha =
              context.payload.pull_request?.head?.sha || context.sha;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

            // Vercel often posts after our job starts — poll briefly.
            for (let i = 0; i < 16; i++) {
              const { data } = await github.rest.repos.getCombinedStatusForRef({
                owner,
                repo,
                ref: sha,
              });
              const match = (data.statuses || []).find((s) => s.context === required);
              if (match) {
                const desc = match.description || "";
                const blocked = /blocked|paused|queued/i.test(desc);
                core.info(`${required}: ${match.state} — ${desc}`);
                if (blocked || match.state === "failure" || match.state === "error") {
                  if (blocked || /blocked|paused/i.test(desc)) {
                    await github.rest.repos.createCommitStatus({
                      owner,
                      repo,
                      sha,
                      state: "success",
                      context: required,
                      description:
                        "Spend-cap pause cleared — production uses Actions on main",
                      target_url: "https://zzaizzai.com",
                    });
                    core.info(`Overwrote blocked status on ${sha.slice(0, 7)}`);
                    return;
                  }
                }
                if (match.state === "success") {
                  core.info("Vercel status already success — nothing to clear");
                  return;
                }
              } else {
                core.info(`${required}: not reported yet (attempt ${i + 1})`);
              }
              await sleep(15_000);
            }
            core.info("No blocked Vercel status appeared — done");
