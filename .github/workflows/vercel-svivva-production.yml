# Optional manual deploy via Vercel CLI (prebuilt).
#
# Production deploys normally use Vercel Git integration (Path A):
#   team zzai-zzai / project all-de-apps-in-one / Root Directory Svivva
#
# This workflow is MANUAL ONLY so pushes do not add failed/skipped deploy jobs
# when VERCEL_CI_DEPLOY or secrets are unset. Run from Actions when needed.
#
# Requires: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID secrets
#           and repo variable VERCEL_CI_DEPLOY=true
#
name: Deploy Svivva (Vercel production)

on:
  workflow_dispatch:

concurrency:
  group: vercel-svivva-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.VERCEL_CI_DEPLOY == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Svivva/package-lock.json

      - name: Install dependencies (Svivva)
        working-directory: Svivva
        run: npm ci --legacy-peer-deps

      - name: Assert canonical Vercel project config
        run: |
          node -e "
            const c = require('./Svivva/vercel-canonical.json');
            if (c.teamSlug !== 'zzai-zzai' || c.projectName !== 'all-de-apps-in-one') {
              console.error('vercel-canonical.json must point at zzai-zzai/all-de-apps-in-one');
              process.exit(1);
            }
            console.log('Vercel target:', c.teamSlug + '/' + c.projectName, '(not svivva-main-app)');
          "

      - name: Require Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Set VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID in repo secrets before running this workflow."
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install -g vercel@53.3.1

      - name: Pull Vercel configuration & env (production)
        working-directory: Svivva
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope=zzai-zzai --project=all-de-apps-in-one

      - name: Build (Vercel prebuilt)
        working-directory: Svivva
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token="$VERCEL_TOKEN" --scope=zzai-zzai --project=all-de-apps-in-one

      - name: Deploy prebuilt → production
        working-directory: Svivva
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" --scope=zzai-zzai --project=all-de-apps-in-one
