# Single production deploy path for main — clears queued builds then deploys once.
#
# Setup (one-time):
#   1. GitHub repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   2. Repo variable: VERCEL_CI_DEPLOY = true
#   3. Vercel dashboard: disconnect svivva-main-app from this repo (see docs/VERCEL_ACCOUNT.md)
#   4. Optional: Vercel → all-de-apps-in-one → Git → disable auto-deploy on push
#      when using this workflow exclusively (vercel.json git.deploymentEnabled.main = false)
#
name: Vercel production (auto)

on:
  push:
    branches: [main]
    paths:
      - "Svivva/**"
      - ".github/workflows/vercel-production-auto.yml"
      - "vercel.json"

concurrency:
  group: vercel-production-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.VERCEL_CI_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Svivva/package-lock.json

      - name: Assert canonical Vercel project
        run: |
          node -e "
            const c = require('./Svivva/vercel-canonical.json');
            if (c.teamSlug !== 'zzai-zzai' || c.projectName !== 'all-de-apps-in-one') {
              console.error('Wrong Vercel project in vercel-canonical.json');
              process.exit(1);
            }
            console.log('Target:', c.teamSlug + '/' + c.projectName);
          "

      - name: Require Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Add VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID to repo secrets."
            exit 1
          fi

      - name: Clear queued / in-progress Vercel deployments
        working-directory: Svivva
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: node scripts/clear-vercel-queue.mjs || true

      - name: Install Vercel CLI
        run: npm install -g vercel@53.3.1

      - name: Pull Vercel env (production)
        working-directory: Svivva
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope=zzai-zzai --project=all-de-apps-in-one

      - name: Build prebuilt (production)
        working-directory: Svivva
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token="$VERCEL_TOKEN" --scope=zzai-zzai --project=all-de-apps-in-one

      - name: Deploy prebuilt → production
        working-directory: Svivva
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" --scope=zzai-zzai --project=all-de-apps-in-one
