# Deprecated — use "Deploy latest (Vercel production)" (vercel-deploy-latest.yml).
# Kept as manual alias for anyone who bookmarked this workflow name.
name: Vercel production (auto)

on:
  workflow_dispatch:

concurrency:
  group: vercel-production-main
  cancel-in-progress: true

permissions:
  contents: read
  statuses: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Svivva/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@53.3.1

      - name: Clear queue and deploy latest
        working-directory: Svivva
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          VERCEL_CI_DEPLOY: ${{ vars.VERCEL_CI_DEPLOY }}
        run: node scripts/ci-vercel-deploy.mjs
